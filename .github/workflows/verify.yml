name: Verify update and build safeguards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test source pins, patch guards, and signed appcasts
        run: python3 -m unittest discover -s tests -v
      - name: Verify the committed patch series checksums
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from patches import patch_bundle
          patch_bundle(json.loads(Path("upstream-lock.json").read_text()))
          print("Patch series checksums verified")
          PY
  native-feed-validation:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile and run native feed validation
        run: |
          xcrun clang++ -std=c++20 -fobjc-arc -framework Foundation \
            tests/update_feed_test.mm -o "$RUNNER_TEMP/sidecar-feed-test"
          "$RUNNER_TEMP/sidecar-feed-test"
